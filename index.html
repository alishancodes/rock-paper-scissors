<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module" src="script.js"></script>

    <style>
        .score {
            white-space: pre-line;
            /*
            white-space: pre-line tells the browser:
            "Keep the newline characters (\n) as actual line breaks."
            */
        }

        div {
            padding : 20px;
        }

        .options > button {
            padding : 20px;
            margin-right : 20px;
        }

    </style>
</head>
<body>
    <div class = "options">
        <button id = "rock">Rock</button>
        <button id = "paper">Paper</button>
        <button id = "scissors">Scissors</button>
    </div>    

    <div class = score></div>

    <div id = "restart">
        <button>Restart</button>
    </div>


</body>
</html>
